<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} - URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .sidebar {
            min-height: 100vh;
            background: #212529;
            width: 220px;
            position: fixed;
            top: 0; left: 0;
            padding-top: 1rem;
        }
        .sidebar a {
            color: #adb5bd;
            display: block;
            padding: .6rem 1.2rem;
            text-decoration: none;
            border-radius: 6px;
            margin: 2px 8px;
        }
        .sidebar a:hover, .sidebar a.active { background: #343a40; color: #fff; }
        .sidebar .brand { color: #fff; font-weight: 700; font-size: 1.1rem; padding: .8rem 1.2rem 1.2rem; }
        .main-content { margin-left: 220px; padding: 2rem; }
        .stat-card { border-radius: 12px; border: none; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="brand"><i class="bi bi-link-45deg"></i> URL Shortener</div>
    <a href="/admin/dashboard" class="{% if request.url.path == '/admin/dashboard' %}active{% endif %}">
        <i class="bi bi-speedometer2 me-2"></i>Dashboard
    </a>
    <a href="/admin/urls" class="{% if '/admin/urls' in request.url.path %}active{% endif %}">
        <i class="bi bi-link me-2"></i>URLs
    </a>
    <a href="/admin/users" class="{% if '/admin/users' in request.url.path %}active{% endif %}">
        <i class="bi bi-people me-2"></i>Users
    </a>
    <hr style="border-color:#343a40">
    <a href="/admin/logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
</div>
<div class="main-content">
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
