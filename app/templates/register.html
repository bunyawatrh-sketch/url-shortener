<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Register - URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { width: 400px; border-radius: 16px; border: none; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    </style>
</head>
<body>
<div class="card p-4">
    <h4 class="text-center fw-bold mb-1">🔗 สมัครสมาชิก</h4>
    <p class="text-center text-muted mb-4">URL Shortener</p>

    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register">
        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100 mb-3">สมัครสมาชิก</button>
    </form>
    <p class="text-center text-muted mb-0">มีบัญชีแล้ว? <a href="/login">เข้าสู่ระบบ</a></p>
</div>
</body>
</html>
